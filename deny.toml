[graph]
all-features = true
targets = [
  "aarch64-apple-darwin",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
yanked = "deny"

[licenses]
allow = ["Apache-2.0", "BSD-3-Clause", "ISC", "MIT", "MIT-0", "Unicode-3.0", "Zlib"]
confidence-threshold = 0.93
private = { ignore = true }
unused-allowed-license = "allow"

[[licenses.exceptions]]
crate = "version-ranges"
allow = ["MPL-2.0"]

[bans]
# A duplicate two dependencies force, which no version bump removes, goes in `skip` with a reason.
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "syn:^2", reason = "typify 0.10 (the newest) uses schemars 0.8, whose derive is on syn 2, and strum_macros 0.28 (the newest, under typify and jsonschema) is on syn 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
