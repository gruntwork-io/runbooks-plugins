name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

env:
  # No job runs az, and uv only installs it.
  MISE_DISABLE_TOOLS: azure-cli,uv

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write # Publishes the JUnit report.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8 # mise.toml's min_version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run lint
      - run: mise run lint-workflows
        env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits.
      - run: mise run semver
      - id: test
        run: mise run test
        env:
          NEXTEST_PROFILE: ci
      - name: Publish test report
        if: ${{ !cancelled() && (steps.test.conclusion == 'success' || steps.test.conclusion == 'failure') }}
        uses: mikepenz/action-junit-report@a16be3a69023e9bd7e748ede768b3282ea7b30ce # v6.7.1
        with:
          report_paths: target/nextest/ci/junit.xml
          check_name: Test report
          fail_on_failure: true
          require_tests: true

  audit:
    name: Audit dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8 # mise.toml's min_version.
      - run: mise run audit

  # The binaries ship for macOS, Windows and arm64 Linux too, and each needs a native run.
  platforms:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8 # mise.toml's min_version.
          install_args: rust cargo-binstall cargo:cargo-nextest
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run test
        env:
          MISE_AUTO_INSTALL: "false" # The lint tools run on Linux only.
          NEXTEST_PROFILE: ci

  mutants:
    name: Mutation-test the change
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # The diff needs the base branch.
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.8 # mise.toml's min_version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: mise run mutants-diff "origin/${BASE_REF}"
        env:
          # The PR's own base: in a GitHub stack, github.base_ref is main for every PR.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
